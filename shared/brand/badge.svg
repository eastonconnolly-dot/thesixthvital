<svg viewBox="0 0 720 420" width="720" height="420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="badgeTitle">
  <title id="badgeTitle">The RPSAS Method: Read, Pick, Speak, Ask, Shift</title>
  <defs>
    <style>
      .card { fill: var(--ink, #0B0B0B); }
      .word { font-family: 'Source Sans 3', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; fill: var(--red, #E4573D); }
      .letter { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 64px; fill: var(--ivory, #F4EFE6); }
      .rail { stroke: var(--red, #E4573D); stroke-width: 2; opacity: 0.65; }
      .method { font-family: 'Source Sans 3', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; fill: var(--ivory, #F4EFE6); }
    </style>
  </defs>

  <rect class="card" x="0" y="0" width="720" height="420" rx="24" />

  <line class="rail" x1="130" y1="350" x2="590" y2="130" />

  <!-- READ -->
  <g transform="translate(130,350)">
    <text class="word" x="0" y="-96" text-anchor="middle">Read</text>
    <text class="letter" x="0" y="-30" text-anchor="middle">R</text>
  </g>

  <!-- PICK -->
  <g transform="translate(245,295)">
    <text class="word" x="0" y="-96" text-anchor="middle">Pick</text>
    <text class="letter" x="0" y="-30" text-anchor="middle">P</text>
  </g>

  <!-- SPEAK -->
  <g transform="translate(360,240)">
    <text class="word" x="0" y="-96" text-anchor="middle">Speak</text>
    <text class="letter" x="0" y="-30" text-anchor="middle">S</text>
  </g>

  <!-- ASK -->
  <g transform="translate(475,185)">
    <text class="word" x="0" y="-96" text-anchor="middle">Ask</text>
    <text class="letter" x="0" y="-30" text-anchor="middle">A</text>
  </g>

  <!-- SHIFT -->
  <g transform="translate(590,130)">
    <text class="word" x="0" y="-96" text-anchor="middle">Shift</text>
    <text class="letter" x="0" y="-30" text-anchor="middle">S</text>
  </g>

  <text class="method" x="360" y="404" text-anchor="middle">RPSAS METHOD</text>
</svg>
