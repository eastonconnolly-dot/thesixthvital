<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quick questions — {{ config.BRAND_NAME }}</title>
  <style>
    :root { --ink:#17263B; --ivory:#F4EFE6; --amber:#E0A458; --muted:#8A97A8; --border:#d9d3c6; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--ivory); color:var(--ink); }
    header { background:var(--ink); color:var(--ivory); padding:16px 24px; }
    main { max-width:640px; margin:0 auto; padding:28px 24px; }
    h1 { font-family: Georgia, serif; font-size:1.4rem; }
    p.sub { color:var(--muted); font-size:0.9rem; margin-top:-6px; }
    #transcript { display:flex; flex-direction:column; gap:10px; margin:20px 0 16px; }
    .bubble { max-width:80%; padding:10px 14px; border-radius:14px; font-size:0.92rem; line-height:1.4; }
    .bubble.assistant { background:#fff; border:1px solid var(--border); align-self:flex-start; }
    .bubble.lead { background:var(--amber); color:var(--ink); align-self:flex-end; }
    .input-row { display:flex; gap:8px; }
    textarea { flex:1; padding:10px; border-radius:8px; border:1px solid var(--border); font:inherit; resize:none; }
    .btn { padding:10px 18px; border-radius:8px; background:var(--amber); color:var(--ink); border:none; font-weight:600; cursor:pointer; font-size:0.9rem; }
    .btn-ghost { background:none; border:1px solid var(--border); color:var(--ink); }
    .btn:disabled { opacity:0.5; cursor:not-allowed; }
    .controls { display:flex; justify-content:flex-end; margin-top:12px; gap:10px; flex-wrap:wrap; }
    .card { background:#fff; border-radius:12px; padding:22px; margin-top:20px; box-shadow:0 4px 16px rgba(23,38,59,0.08); }
    .slot-btn { display:block; width:100%; text-align:left; padding:10px 14px; margin-bottom:8px; border-radius:8px; border:1px solid var(--border); background:#fff; cursor:pointer; font:inherit; }
    .slot-btn:hover { border-color:var(--amber); }
    #result { display:none; }
    #starting { color:var(--muted); font-size:0.9rem; }
  </style>
</head>
<body>
  <header><strong>{{ config.BRAND_NAME }}</strong></header>
  <main>
    <h1>A few quick questions</h1>
    <p class="sub">Before we get you on the calendar, help us point you at the right next step.</p>

    <div id="transcript"></div>
    <p id="starting">Loading…</p>

    <div class="input-row" id="inputRow" style="display:none;">
      <textarea id="turnInput" rows="2" placeholder="Type your answer…"></textarea>
    </div>
    <div class="controls" id="controls" style="display:none;">
      <button class="btn btn-ghost" id="doneBtn">I'm done — wrap up</button>
      <button class="btn" id="sendBtn">Send</button>
    </div>

    <div id="result"></div>
  </main>

  <script>
    const leadToken = {{ lead.qualifier_token | tojson }};
    const transcript = document.getElementById('transcript');
    const input = document.getElementById('turnInput');
    const inputRow = document.getElementById('inputRow');
    const controls = document.getElementById('controls');
    const sendBtn = document.getElementById('sendBtn');
    const doneBtn = document.getElementById('doneBtn');
    const starting = document.getElementById('starting');
    const resultEl = document.getElementById('result');

    function addBubble(role, text) {
      const div = document.createElement('div');
      div.className = 'bubble ' + role;
      div.textContent = text;
      transcript.appendChild(div);
      div.scrollIntoView({ behavior: 'smooth' });
    }

    function setBusy(busy) {
      sendBtn.disabled = busy;
      doneBtn.disabled = busy;
    }

    function sendTurn() {
      const text = input.value.trim();
      if (!text) return;
      addBubble('lead', text);
      input.value = '';
      setBusy(true);
      fetch(`/qualify/${leadToken}/turn`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      })
        .then(r => r.json())
        .then(data => { if (data.reply) addBubble('assistant', data.reply); })
        .finally(() => setBusy(false));
    }

    function finishUp() {
      setBusy(true);
      fetch(`/qualify/${leadToken}/complete`, { method: 'POST' })
        .then(r => r.json())
        .then(showResult)
        .finally(() => setBusy(false));
    }

    function showResult(data) {
      inputRow.style.display = 'none';
      controls.style.display = 'none';
      resultEl.style.display = 'block';

      if (data.budget_fit) {
        resultEl.innerHTML = `
          <div class="card">
            <h2>Great — let's find a time.</h2>
            <p>${data.brief || ''}</p>
            <div id="slotList">Loading available times…</div>
          </div>`;
        fetch(`/qualify/${leadToken}/slots`)
          .then(r => r.json())
          .then(slotData => {
            const list = document.getElementById('slotList');
            list.innerHTML = '';
            (slotData.slots || []).slice(0, 8).forEach(iso => {
              const b = document.createElement('button');
              b.className = 'slot-btn';
              b.textContent = new Date(iso).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
              b.addEventListener('click', () => bookSlot(iso, list));
              list.appendChild(b);
            });
            if (!(slotData.slots || []).length) list.textContent = 'No times available right now — we will follow up by email.';
          });
      } else {
        resultEl.innerHTML = `
          <div class="card">
            <h2>Here's where to start</h2>
            <p>Based on what you shared, the best next step is self-serve — no call needed.</p>
            <a class="btn" href="${data.checkout_url}">Continue to checkout</a>
          </div>`;
      }
    }

    function bookSlot(iso, list) {
      list.innerHTML = 'Booking…';
      fetch(`/qualify/${leadToken}/book`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slot_start: iso }),
      })
        .then(r => r.json())
        .then(data => {
          list.innerHTML = data.booked
            ? `<p>Booked for ${new Date(data.slot_start).toLocaleString()}. Check your email for the invite.</p>`
            : `<p>${data.error || 'Could not book that time — please try another.'}</p>`;
        });
    }

    sendBtn.addEventListener('click', sendTurn);
    doneBtn.addEventListener('click', finishUp);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendTurn(); }
    });

    fetch(`/qualify/${leadToken}/start`, { method: 'POST' })
      .then(r => r.json())
      .then(data => {
        starting.style.display = 'none';
        inputRow.style.display = 'flex';
        controls.style.display = 'flex';
        if (data.question) addBubble('assistant', data.question);
      });
  </script>
</body>
</html>
