<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RPSAS Practice</title>
  <style>
    :root { --ink:#17263B; --ivory:#F4EFE6; --amber:#E0A458; --muted:#8A97A8; --border:#d9d3c6; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--ivory); color:var(--ink); }
    main { max-width:440px; margin:0 auto; padding:64px 24px; }
    h1 { font-family: Georgia, serif; font-size:1.7rem; }
    .card { background:#fff; border-radius:12px; padding:28px; box-shadow:0 4px 16px rgba(23,38,59,0.08); }
    label { font-size:0.85rem; font-weight:600; display:block; margin:14px 0 6px; }
    input, select { width:100%; padding:9px 10px; border-radius:6px; border:1px solid var(--border); font:inherit; }
    .btn { display:inline-block; margin-top:18px; padding:10px 20px; border-radius:8px; background:var(--amber); color:var(--ink); border:none; font-weight:600; cursor:pointer; font-size:0.95rem; }
    .msg { padding:10px 14px; border-radius:8px; font-size:0.9rem; margin-top:14px; display:none; }
    .msg.show { display:block; }
    .msg.ok { background:#e3f3e8; color:#2f7a4f; }
    .msg.err { background:#fbe4e4; color:#a83a3a; }
    .new-fields { display:none; }
    .new-fields.show { display:block; }
    .hint { font-size:0.8rem; color:var(--muted); margin-top:6px; }
  </style>
</head>
<body>
  <main>
    <h1>RPSAS Practice</h1>
    <p style="color:var(--muted);">Simulated-patient training, scored on the RPSAS rubric.</p>
    <div class="card">
      {% if error %}<div class="msg show err">{{ error }}</div>{% endif %}
      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" required />

        <div class="new-fields" id="newFields">
          <label for="name">Name</label>
          <input type="text" id="name" />
          <label for="track">Track</label>
          <select id="track">
            <option value="applicant">Med-school / residency applicant</option>
            <option value="physician">Physician or surgeon</option>
            <option value="program">Residency / fellowship program</option>
          </select>
          <div class="hint">First time here — we'll start a 7-day free trial.</div>
        </div>

        <button type="submit" class="btn">Send me a sign-in link</button>
      </form>
      <div class="msg" id="msg"></div>
    </div>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const newFields = document.getElementById('newFields');
    const msg = document.getElementById('msg');

    // Show track/name fields optimistically; harmless if the account already exists.
    document.getElementById('email').addEventListener('input', () => newFields.classList.add('show'));

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const body = {
        email: document.getElementById('email').value,
        name: document.getElementById('name').value,
        track: document.getElementById('track').value,
      };
      fetch('/practice/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      })
        .then(r => r.json().then(data => ({ ok: r.ok, data })))
        .then(({ ok, data }) => {
          if (!ok) throw new Error(data.error || 'Something went wrong');
          if (data.dev_link) {
            msg.innerHTML = `Dev mode (no Gmail sender configured) — <a href="${data.dev_link}">click here to sign in</a>.`;
          } else {
            msg.textContent = 'Check your email for a sign-in link.';
          }
          msg.className = 'msg show ok';
        })
        .catch(err => { msg.textContent = err.message; msg.className = 'msg show err'; });
    });
  </script>
</body>
</html>
