<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ lesson.title }} — {{ config.BRAND_NAME }} Practice</title>
  <style>
    :root { --ink:#17263B; --ivory:#F4EFE6; --amber:#E0A458; --muted:#8A97A8; --border:#d9d3c6; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--ivory); color:var(--ink); }
    header { background:var(--ink); color:var(--ivory); padding:16px 24px; display:flex; justify-content:space-between; align-items:center; }
    header a { color:var(--ivory); text-decoration:none; font-weight:600; }
    main { max-width:620px; margin:0 auto; padding:36px 24px 80px; }
    .eyebrow { font-size:0.8rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--amber); font-weight:700; margin-bottom:6px; }
    h1 { font-family: Georgia, serif; font-size:2rem; margin:0 0 4px; }
    .subtitle { color:var(--muted); font-size:1rem; margin-bottom:28px; }
    .card { background:#fff; border-radius:12px; padding:28px; box-shadow:0 4px 16px rgba(23,38,59,0.08); }
    .card p { line-height:1.65; font-size:0.98rem; margin:0 0 1.1em; }
    .card p:last-child { margin-bottom:0; }
    .card strong { color:var(--ink); }
    .actions { margin-top:24px; display:flex; justify-content:space-between; align-items:center; }
    .btn { padding:10px 22px; border-radius:8px; background:var(--amber); color:var(--ink); border:none; font-weight:600; cursor:pointer; font-size:0.95rem; text-decoration:none; display:inline-block; }
    .btn:disabled { opacity:0.6; cursor:default; }
    .done-label { color:var(--muted); font-size:0.9rem; }
  </style>
</head>
<body>
  <header>
    <a href="{{ url_for('practice.dashboard') }}">&larr; {{ config.BRAND_NAME }} Practice</a>
  </header>
  <main>
    <div class="eyebrow">Micro-lesson</div>
    <h1>{{ lesson.title }}</h1>
    <div class="subtitle">{{ lesson.subtitle }}</div>
    <div class="card">
      {{ lesson_html|safe }}
    </div>
    <div class="actions">
      <a class="btn btn-ghost" href="{{ url_for('practice.dashboard') }}" style="background:none; border:1px solid var(--border); color:var(--ink);">Back to dashboard</a>
      {% if already_completed %}
      <span class="done-label">Completed ✓</span>
      {% else %}
      <button class="btn" id="completeBtn">Mark complete</button>
      {% endif %}
    </div>
  </main>

  {% if not already_completed %}
  <script>
    document.getElementById('completeBtn').addEventListener('click', function () {
      this.disabled = true;
      this.textContent = 'Saving…';
      fetch('/practice/lessons/{{ lesson_key }}/complete', { method: 'POST' })
        .then(() => { window.location.href = '{{ url_for("practice.dashboard") }}'; });
    });
  </script>
  {% endif %}
</body>
</html>
