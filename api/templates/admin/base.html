<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Admin{% endblock %} — {{ config.BRAND_NAME }}</title>
  <style>
    :root {
      --ink: #17263B; --ivory: #F4EFE6; --amber: #E0A458; --muted: #8A97A8; --border: #d9d3c6;
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--ivory); color: var(--ink); }
    header { background: var(--ink); color: var(--ivory); padding: 16px 24px; display:flex; justify-content:space-between; align-items:center; }
    header a { color: var(--ivory); text-decoration:none; font-weight:600; }
    main { max-width: 1080px; margin: 0 auto; padding: 32px 24px; }
    table { width:100%; border-collapse: collapse; background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 4px 16px rgba(23,38,59,0.08); }
    th, td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--border); font-size:0.9rem; }
    th { background: #efe9dc; }
    .tag { display:inline-block; padding:2px 8px; border-radius:999px; background: var(--border); font-size:0.75rem; }
    .btn { display:inline-block; padding:8px 16px; border-radius:8px; background: var(--amber); color: var(--ink); text-decoration:none; font-weight:600; border:none; cursor:pointer; font-size:0.9rem; }
    .card { background:#fff; border-radius:12px; padding:24px; margin-bottom:20px; box-shadow:0 4px 16px rgba(23,38,59,0.08); }
    .flash { padding:10px 16px; border-radius:8px; margin-bottom:16px; font-size:0.9rem; }
    .flash-success { background:#e3f3e8; color:#2f7a4f; }
    .flash-error { background:#fbe4e4; color:#a83a3a; }
    label { font-size:0.85rem; font-weight:600; display:block; margin-bottom:4px; }
    input, select { font:inherit; padding:8px 10px; border-radius:6px; border:1px solid var(--border); margin-bottom:12px; width:100%; }
    h1, h2 { font-family: Georgia, serif; }
  </style>
</head>
<body>
  <header>
    <a href="{{ url_for('admin.dashboard') }}">{{ config.BRAND_NAME }} Admin</a>
    {% if session.get('is_admin') %}<a href="{{ url_for('admin.logout') }}">Log out</a>{% endif %}
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
