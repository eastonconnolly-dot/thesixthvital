databases:
  - name: rpsas-db
    plan: free
    databaseName: rpsas
    user: rpsas

services:
  - type: web
    name: rpsas-api
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: BRAND_NAME
        value: Sixth Vital
      - key: DATABASE_URL
        fromDatabase:
          name: rpsas-db
          property: connectionString
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: GMAIL_SENDER_EMAIL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_JSON
        sync: false
      - key: GOOGLE_TOKEN_JSON
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
      - key: QUO_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-5
      - key: STRIPE_PRICE_APPLICANT
        sync: false
      - key: STRIPE_PRICE_PHYSICIAN
        sync: false
      - key: STRIPE_PRICE_PROGRAM_SEAT
        sync: false
      - key: COMPANY_MAILING_ADDRESS
        sync: false
      - key: SITE_BASE_URL
        sync: false
      - key: API_BASE_URL
        sync: false

      # Phase 2 — outreach
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: HUNTER_API_KEY
        sync: false
      - key: APOLLO_API_KEY
        sync: false

      # Phase 3 — content engine
      - key: BUFFER_API_KEY
        sync: false
      - key: PUBLER_API_KEY
        sync: false
      - key: WHISPER_MODEL_SIZE
        value: base

      # Hub tenant sync — see HUB_INTEGRATION.md. All optional; no-ops until set.
      - key: HUB_API_BASE_URL
        sync: false
      - key: HUB_API_KEY
        sync: false
      - key: HUB_PIPELINE_KEY_APPLICANT
        sync: false
      - key: HUB_PIPELINE_KEY_PHYSICIAN
        sync: false
      - key: HUB_PIPELINE_KEY_PROGRAM
        sync: false

      # Phase 6 — founder off the loop
      - key: FOUNDER_EMAIL
        sync: false
      - key: PRINT_VENDOR_EMAIL
        sync: false
      # UPLOAD_STORAGE_DIR intentionally not set here — defaults to local disk
      # under api/, which is ephemeral on Render. Swap for an S3-compatible
      # bucket before relying on this in production (see api/INTEGRATION.md).

  - type: cron
    name: rpsas-weekly-digest
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: flask send-digest
    schedule: "0 6 * * 1" # Monday 6am UTC — adjust for the founder's actual timezone
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rpsas-db
          property: connectionString
      - key: BRAND_NAME
        value: Sixth Vital
      - key: FOUNDER_EMAIL
        sync: false
      - key: GMAIL_SENDER_EMAIL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_JSON
        sync: false
      - key: GOOGLE_TOKEN_JSON
        sync: false
      - key: COMPANY_MAILING_ADDRESS
        sync: false
      - key: SITE_BASE_URL
        sync: false
      - key: STRIPE_PRICE_APPLICANT
        sync: false
      - key: STRIPE_PRICE_PHYSICIAN
        sync: false
      - key: STRIPE_PRICE_PROGRAM_SEAT
        sync: false

  - type: cron
    name: rpsas-nightly-backup
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: flask backup-db
    schedule: "0 9 * * *" # nightly, 9am UTC (~1-2am Pacific) — adjust as needed
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rpsas-db
          property: connectionString
      - key: BRAND_NAME
        value: Sixth Vital
      - key: FOUNDER_EMAIL
        sync: false
      - key: GMAIL_SENDER_EMAIL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_JSON
        sync: false
      - key: GOOGLE_TOKEN_JSON
        sync: false
      # pick ONE backup destination:
      - key: BACKUP_GITHUB_REPO
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_BUCKET
        sync: false
      - key: BACKUP_S3_ENDPOINT_URL
        sync: false

  - type: cron
    name: rpsas-sequence-tick
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: flask tick-sequences
    schedule: "*/15 * * * *" # every 15 min, per the brief — Render's free plan may enforce a coarser minimum; widen if it rejects this
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rpsas-db
          property: connectionString
      - key: BRAND_NAME
        value: Sixth Vital
      - key: FOUNDER_EMAIL
        sync: false
      - key: GMAIL_SENDER_EMAIL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_JSON
        sync: false
      - key: GOOGLE_TOKEN_JSON
        sync: false
      - key: QUO_API_KEY
        sync: false
      - key: SEQUENCE_DAILY_SEND_CAP
        value: "80"
      - key: SEQUENCE_RAMP_DAYS
        value: "14"
      - key: SEQUENCE_RAMP_START_CAP
        value: "10"

  - type: cron
    name: rpsas-check-replies
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: flask check-replies
    schedule: "*/15 * * * *" # every 15 min, offset from the tick job in practice by Render's own scheduling jitter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rpsas-db
          property: connectionString
      - key: BRAND_NAME
        value: Sixth Vital
      - key: FOUNDER_EMAIL
        sync: false
      - key: GMAIL_SENDER_EMAIL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_JSON
        sync: false
      - key: GOOGLE_TOKEN_JSON
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-5

  - type: cron
    name: rpsas-auto-approve-proposals
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: flask auto-approve-proposals
    schedule: "*/15 * * * *" # every 15 min -- guards a 2-hour founder-approval window, see api/INTEGRATION.md
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rpsas-db
          property: connectionString
      - key: BRAND_NAME
        value: Sixth Vital
      - key: FOUNDER_EMAIL
        sync: false
      - key: GMAIL_SENDER_EMAIL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_JSON
        sync: false
      - key: GOOGLE_TOKEN_JSON
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false

  - type: cron
    name: rpsas-check-content-inventory
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: flask check-content-inventory
    schedule: "0 13 * * 1" # Monday 1pm UTC (weekly) -- adjust for the founder's actual timezone
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rpsas-db
          property: connectionString
      - key: BRAND_NAME
        value: Sixth Vital
      - key: FOUNDER_EMAIL
        sync: false
      - key: GMAIL_SENDER_EMAIL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_JSON
        sync: false
      - key: GOOGLE_TOKEN_JSON
        sync: false

  - type: cron
    name: rpsas-delivery-reminders
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: flask send-delivery-reminders
    schedule: "0 14 * * *" # daily, 2pm UTC -- the 7/3/1-day-before-delivery reminder chain
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rpsas-db
          property: connectionString
      - key: BRAND_NAME
        value: Sixth Vital
      - key: FOUNDER_EMAIL
        sync: false
      - key: GMAIL_SENDER_EMAIL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_JSON
        sync: false
      - key: GOOGLE_TOKEN_JSON
        sync: false
      - key: SITE_BASE_URL
        sync: false
      - key: API_BASE_URL
        sync: false

  - type: cron
    name: rpsas-scheduled-followups
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: flask send-scheduled-followups
    schedule: "0 15 * * *" # daily, 3pm UTC -- 30-day check-in confirmation + day-7 referral ask
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rpsas-db
          property: connectionString
      - key: BRAND_NAME
        value: Sixth Vital
      - key: FOUNDER_EMAIL
        sync: false
      - key: GMAIL_SENDER_EMAIL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_JSON
        sync: false
      - key: GOOGLE_TOKEN_JSON
        sync: false
      - key: API_BASE_URL
        sync: false
